name: ci

on:
  push:
  pull_request:

jobs:
  assets:
    name: asset licence gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_assets.py

  broker:
    name: broker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: broker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  js:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Plain ESM with no build step (and no package.json at the root), so parse each file as a module.
      - run: |
          for f in packages/core/src/*.js stage/*.js demo/*.mjs motion/blender/*.mjs; do
            node --input-type=module --check < "$f" || { echo "syntax error in $f"; exit 1; }
          done
