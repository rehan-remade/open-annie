<!doctype html>
<!-- Browser-window overlay for the demo video (frame.mjs). Screenshot with a transparent
     background: the page area is a hole the video shows through; everything else (desktop,
     window shadow, tab strip, address bar) is opaque. Layout comes from the query string. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap">
<style>
  :root {
    --ink: #0d0d0d; --muted: #8a8984; --faint: #b9b8b3;
    --strip: #e9e7e3; --bar: #f9f8f6; --field: #efeeeb; --line: rgba(13, 13, 13, 0.1);
  }
  html, body { margin: 0; background: transparent; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  svg.desk { position: absolute; inset: 0; }
  .chrome { position: absolute; border-radius: 14px 14px 0 0; overflow: hidden; background: var(--bar); }
  .strip { position: absolute; left: 0; right: 0; top: 0; height: 37px; background: var(--strip); }
  .lights { position: absolute; left: 16px; top: 13px; display: flex; gap: 8px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.12); }
  .tab { position: absolute; left: 86px; top: 7px; width: 236px; height: 30px; border-radius: 9px 9px 0 0; background: var(--bar);
         display: flex; align-items: center; gap: 8px; padding: 0 10px 0 12px; box-sizing: border-box; font-size: 12.5px; font-weight: 500; color: var(--ink); }
  .tab .dot { width: 13px; height: 13px; border-radius: 50%; flex: none;
              background: radial-gradient(circle at 30% 30%, #fbcfe8, #c4b5fd 45%, #7dd3fc); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.6); }
  .tab .title { flex: 1; letter-spacing: -0.01em; }
  .tab .rec { width: 7px; height: 7px; border-radius: 50%; background: #ef4444; flex: none; }
  .tab .x { color: var(--muted); font-size: 13px; }
  .plus { position: absolute; left: 334px; top: 9px; color: var(--muted); font-size: 18px; font-weight: 400; }
  .bar { position: absolute; left: 0; right: 0; top: 37px; height: 36px; display: flex; align-items: center; gap: 4px; padding: 0 12px; box-sizing: border-box;
         border-bottom: 1px solid var(--line); }
  .icon { width: 28px; height: 28px; display: grid; place-items: center; color: #5f5e5a; flex: none; }
  .icon.off { color: var(--faint); }
  .field { flex: 1; height: 27px; margin: 0 8px 0 6px; border-radius: 14px; background: var(--field); display: flex; align-items: center; gap: 8px; padding: 0 10px 0 11px;
           font-size: 13.5px; letter-spacing: -0.005em; }
  .field .host { color: var(--ink); }
  .field .path { color: var(--muted); margin-left: -8px; }
  .field .grow { flex: 1; }
  .avatar { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fbcfe8, #c4b5fd 45%, #7dd3fc); margin: 0 6px 0 4px; }
  svg { display: block; }
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const W = +q.get("cw") || 1920, H = +q.get("ch") || 1080; // canvas
  const x = +q.get("x"), y = +q.get("y"), w = +q.get("w"), h = +q.get("h"), head = +q.get("head"), r = 14; // window and page area
  const url = q.get("url") || "localhost:8080/stage/";
  const title = q.get("title") || "open-annie";
  const slash = url.indexOf("/");
  const host = slash < 0 ? url : url.slice(0, slash), path = slash < 0 ? "" : url.slice(slash);
  const winTop = y - head; // not `top`: that's window.top in a classic script
  // Page hole: square top (under the toolbar), rounded bottom corners like the window.
  const hole = `M${x},${y} H${x + w} V${y + h - r} Q${x + w},${y + h} ${x + w - r},${y + h} H${x + r} Q${x},${y + h} ${x},${y + h - r} Z`;
  document.body.style.cssText = `width:${W}px;height:${H}px;position:relative;overflow:hidden`;
  document.body.insertAdjacentHTML("beforeend", `
  <svg class="desk" width="${W}" height="${H}">
    <defs>
      <radialGradient id="pink" cx="0.12" cy="0.1" r="0.55"><stop offset="0" stop-color="#fbcfe8" stop-opacity="0.75"/><stop offset="1" stop-color="#fbcfe8" stop-opacity="0"/></radialGradient>
      <radialGradient id="violet" cx="0.92" cy="0.95" r="0.6"><stop offset="0" stop-color="#c4b5fd" stop-opacity="0.7"/><stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/></radialGradient>
      <radialGradient id="sky" cx="0.88" cy="0.05" r="0.45"><stop offset="0" stop-color="#7dd3fc" stop-opacity="0.45"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/></radialGradient>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="26"/></filter>
      <filter id="tight" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
      <mask id="m"><rect width="${W}" height="${H}" fill="#fff"/><path d="${hole}" fill="#000"/></mask>
    </defs>
    <g mask="url(#m)">
      <rect width="${W}" height="${H}" fill="#f4f3f1"/>
      <rect width="${W}" height="${H}" fill="url(#pink)"/>
      <rect width="${W}" height="${H}" fill="url(#violet)"/>
      <rect width="${W}" height="${H}" fill="url(#sky)"/>
      <rect x="${x}" y="${winTop + 26}" width="${w}" height="${h + head - 10}" rx="${r}" fill="rgba(13,13,13,0.16)" filter="url(#soft)"/>
      <rect x="${x}" y="${winTop + 4}" width="${w}" height="${h + head - 2}" rx="${r}" fill="rgba(13,13,13,0.07)" filter="url(#tight)"/>
      <rect x="${x - 0.5}" y="${winTop - 0.5}" width="${w + 1}" height="${h + head + 1}" rx="${r + 0.5}" fill="none" stroke="rgba(13,13,13,0.14)"/>
    </g>
  </svg>
  <div class="chrome" style="left:${x}px;top:${winTop}px;width:${w}px;height:${head}px">
    <div class="strip"></div>
    <div class="lights"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <div class="tab"><span class="dot"></span><span class="title">${title}</span><span class="rec" title="using your microphone"></span><span class="x">✕</span></div>
    <div class="plus">+</div>
    <div class="bar">
      <div class="icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8H3M7.5 3.5 3 8l4.5 4.5"/></svg></div>
      <div class="icon off"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M8.5 3.5 13 8l-4.5 4.5"/></svg></div>
      <div class="icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.8v2.7h-2.7"/></svg></div>
      <div class="field">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round"><circle cx="5" cy="5" r="2"/><circle cx="11" cy="11" r="2"/><path d="M7 5h7M2 11h7"/></svg>
        <span class="host">${host}</span><span class="path">${path}</span><span class="grow"></span>
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round"><rect x="5.5" y="1.5" width="5" height="8" rx="2.5"/><path d="M3 8a5 5 0 0 0 10 0M8 13v1.8"/></svg>
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#5f5e5a" stroke-width="1.4" stroke-linejoin="round"><path d="m8 1.8 1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6Z"/></svg>
      </div>
      <div class="avatar"></div>
      <div class="icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="3.2" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="8" cy="12.8" r="1.3"/></svg></div>
    </div>
  </div>`);
  document.fonts.ready.then(() => document.body.setAttribute("data-ready", "1"));
</script>
</body>
</html>
